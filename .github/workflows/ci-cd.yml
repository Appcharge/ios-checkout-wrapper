name: CI/CD iOS Checkout Wrapper
run-name: ${{ inputs.env }} iOS Checkout Wrapper

on:
    workflow_dispatch:
        inputs:
            env:
                type: choice
                description: Choose which env to deploy
                required: true
                default: Dev
                options:
                    - Dev
                    - Staging
                    - Sandbox
                    - Prod
                    

jobs:
    BuildArtifact-Dev:
        name: Build & deploy Dev
        if: ${{ inputs.env == 'Dev' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v1
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
                aws-secret-access-key:  ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
                aws-region: ${{ vars.AWS_DEFAULT_REGION }}

            - name: Install dependencies
              run: |
                npm ci
                npm run build:prod

            - name: Deploy & Invalidate
              run: |
                aws s3 sync ./build s3://${{ vars.S3_BUCKET_DEV }} --cache-control 'public, max-age=0'
                aws cloudfront create-invalidation --distribution-id ${{ vars.CDN_DISTRIBUTION_ID_DEV }} --paths "/*"

    BuildArtifact-Staging:
        name: Build & deploy Staging
        if: ${{ inputs.env == 'Staging' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v1
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
                aws-secret-access-key:  ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
                aws-region: ${{ vars.AWS_DEFAULT_REGION }}

            - name: Install dependencies
              run: |
                npm ci
                npm run build:prod
  
            - name: Deploy & Invalidate
              run: |
                aws s3 sync ./build s3://${{ vars.S3_BUCKET_DEV }} --cache-control 'public, max-age=0'
                aws cloudfront create-invalidation --distribution-id ${{ vars.CDN_DISTRIBUTION_ID_STAGING }} --paths "/*"


    BuildArtifact-Prod:
        name: Build & deploy Prod
        if: ${{ inputs.env == 'Prod' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v1
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
                aws-secret-access-key:  ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
                aws-region: ${{ vars.AWS_DEFAULT_REGION }}

            - name: Install dependencies
              run: |
                npm ci
                npm run build:prod
  
            - name: Deploy & Invalidate
              run: |
                aws s3 sync ./build s3://${{ vars.S3_BUCKET_PROD }} --cache-control 'public, max-age=0'
                aws cloudfront create-invalidation --distribution-id ${{ vars.CDN_DISTRIBUTION_ID_PROD }} --paths "/*"


    BuildArtifact-Sandbox:
        name: Build & deploy Sandbox
        if: ${{ inputs.env == 'Sandbox' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v1
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
                aws-secret-access-key:  ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
                aws-region: ${{ vars.AWS_DEFAULT_REGION }}

            - name: Install dependencies
              run: |
                npm ci
                npm run build:prod
  
            - name: Deploy & Invalidate
              run: |
                aws s3 sync ./build s3://${{ vars.S3_BUCKET_SANDBOX }} --cache-control 'public, max-age=0'
                aws cloudfront create-invalidation --distribution-id ${{ vars.CDN_DISTRIBUTION_ID_SANDBOX }} --paths "/*"


